[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "psfwidget"
dynamic = ["version"]
description = "PSF analysis, theoretical comparison, and Levey-Jennings tracking for microscope quality control."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "CU-IBIF" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Core runtime dependencies: numerics, fitting, and the four format readers (all BSD).
# Theory models, reporting, and the GUI are optional extras so the headless
# core stays light (see docs/PLAN.md §4 and docs/LICENSE_AUDIT.md).
dependencies = [
    "czifile>=2026.4.11",
    "liffile>=2026.4.11",
    "nd2>=0.10.4",
    "numpy>=2.1",
    "scipy>=1.13",
    "tifffile>=2026.3.3",
]

[project.optional-dependencies]
# Populated as each work package lands (WP3, WP5, WP7).
theory = []
report = [
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]
napari = [
    "napari[pyside6]>=0.5",
    "psfwidget[report]",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
gui-test = [
    "psfwidget[napari,test]",
    "pytest-qt>=4.4",
]
dev = [
    "psfwidget[report,test]",
    "mypy>=1.10",
    "packaging>=23.0",
    "pre-commit>=3.7",
    "ruff>=0.6",
    "scipy-stubs",
    "types-openpyxl",
    "types-reportlab",
]

[project.entry-points."napari.manifest"]
psfwidget = "psfwidget.napari:napari.yaml"

[project.scripts]
psfwidget = "psfwidget.automation.cli:main"

[project.urls]
Homepage = "https://github.com/CU-IBIF/PSFWidget"
Issues = "https://github.com/CU-IBIF/PSFWidget/issues"

[tool.hatch.version]
path = "src/psfwidget/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/psfwidget"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 99
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "NPY",     # numpy-specific
    "RUF",
    "SIM",
    "PT",      # pytest style
    "D",       # docstrings
]
ignore = [
    "D105",  # magic methods
    "D107",  # __init__
]

# Mathematical notation in docstrings and in formula strings shown to users.
allowed-confusables = ["−", "×", "ρ", "σ", "–"]

[tool.ruff.lint.isort]
known-first-party = ["psfwidget", "traceability", "fetch_test_data", "check_licenses", "fitting_accuracy", "demo_tracking"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]  # tests embed long XML and text fixtures
"tools/**" = ["D"]
"src/psfwidget/report/render_html.py" = ["E501"]  # inline CSS

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]
mypy_path = "src"

[[tool.mypy.overrides]]
# The GUI dependencies are optional; napari ships no type information, and
# qtpy is typed only when a Qt binding is installed.
module = ["napari", "napari.*", "npe2", "npe2.*", "qtpy", "qtpy.*", "pytestqt", "pytestqt.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
# Without a Qt binding installed, QWidget is Any to the type checker.
module = [
    "psfwidget.napari.analysis_widget",
    "psfwidget.napari.tracking_widget",
    "psfwidget.napari.profile_editor",
]
disallow_subclassing_any = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = [
    "error",
    # napari and its dependencies (GUI tests only); not PSFWidget's code.
    "ignore::DeprecationWarning:pydantic.*",
    "ignore:.*is deprecated.*Pydantic V2:DeprecationWarning",
    "ignore::DeprecationWarning:napari.*",
    "ignore::DeprecationWarning:vispy.*",
    "ignore::DeprecationWarning:npe2.*",
    "ignore::DeprecationWarning:pint.*",
    "ignore::FutureWarning:napari.*",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["psfwidget"]
branch = true
# The Qt widgets are measured by the GUI job (tests/gui-coverage.toml), which
# has napari and a display; their logic lives in modules measured here.
omit = [
    "*/psfwidget/napari/analysis_widget.py",
    "*/psfwidget/napari/tracking_widget.py",
    "*/psfwidget/napari/profile_editor.py",
]

[tool.coverage.report]
fail_under = 85  # NFR-09
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
