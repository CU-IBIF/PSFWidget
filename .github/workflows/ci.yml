name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types, traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy
      - run: python tools/traceability.py --check
      - run: python tools/check_licenses.py

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]  # NFR-05
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[report,test]"
      - name: Cache golden test files
        uses: actions/cache@v6
        with:
          path: tests/data/cache
          key: golden-${{ hashFiles('tests/data/manifest.json') }}
          enableCrossOsArchive: true
      - name: Fetch golden test files
        run: python tools/fetch_test_data.py --require-public
      - name: Run tests
        env:
          PSFWIDGET_REQUIRE_TEST_DATA: "1"
        run: >-
          python -m pytest
          --cov --cov-report=term --cov-report=xml
          --req-report=requirement-coverage.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            coverage.xml
            requirement-coverage.csv
          if-no-files-found: ignore

  gui:
    name: GUI (napari, ${{ matrix.os }}, py3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows added in M5.4a: the facility PCs run Windows (DEF-01, NFR-05).
        os: [ubuntu-latest, windows-latest]
    # Not yet blocking on Windows: the runner's software OpenGL fails napari's
    # first OpenGL call (GL_MAX_TEXTURE_SIZE, "invalid operation") in every test
    # that draws an image, while the other GUI tests pass. Remove once fixed.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      # UTF-8 output on Windows: npe2 and pytest print characters (e.g. a tick)
      # that the runner's default cp1252 console cannot encode.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the libraries Qt and OpenGL need on a headless runner
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1-mesa-dri
          libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libdbus-1-3
      # The Windows set-up follows napari's own CI (reusable_run_tox_test.yml):
      # a real display size, then software OpenGL (Mesa) for the canvas.
      - name: Set the Windows display resolution
        if: runner.os == 'Windows'
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
        shell: powershell
      - name: Software OpenGL for napari's canvas (the runner has no GPU driver)
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2.0
        with:
          qt: true
      - run: python -m pip install -e ".[gui-test]"
      - run: python tools/check_licenses.py  # NFR-10 with the GUI stack installed
      - run: npe2 validate psfwidget
      - name: Cache golden test files
        uses: actions/cache@v6
        with:
          path: tests/data/cache
          key: golden-${{ hashFiles('tests/data/manifest.json') }}
          enableCrossOsArchive: true
      - name: Fetch golden test files (drag and drop of each format)
        run: python tools/fetch_test_data.py --require-public
      - name: Run GUI tests (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          PSFWIDGET_REQUIRE_TEST_DATA: "1"
        run: >-
          xvfb-run -a python -m pytest tests/test_gui_analysis.py tests/test_gui_tracking.py
          tests/test_gui_profile_editor.py tests/test_gui_reader.py tests/test_review_session.py
          --cov --cov-config=tests/gui-coverage.toml --cov-report=term
      - name: Run GUI tests (Windows)
        if: runner.os == 'Windows'
        env:
          PSFWIDGET_REQUIRE_TEST_DATA: "1"
        run: >-
          python -m pytest tests/test_gui_analysis.py tests/test_gui_tracking.py
          tests/test_gui_profile_editor.py tests/test_gui_reader.py tests/test_review_session.py

  docs:
    name: API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[report,docs]"
      - run: python tools/build_api_docs.py site/api  # fails on any pdoc warning (UI-05)
      - uses: actions/upload-artifact@v7
        with:
          name: api-reference
          path: site/api

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build --outdir dist
      - run: python -m twine check dist/*
      - name: Install the wheel in a clean environment and run the self-test
        shell: bash
        run: |
          python -m venv clean
          if [ -f clean/Scripts/python.exe ]; then PY=clean/Scripts/python.exe; else PY=clean/bin/python; fi
          WHEEL=$(ls dist/*.whl)
          $PY -m pip install "${WHEEL}[report]"
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$PY" -m psfwidget selftest
