name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types, traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy
      - run: python tools/traceability.py --check
      - run: python tools/check_licenses.py

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]  # NFR-05
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[report,test]"
      - name: Cache golden test files
        uses: actions/cache@v6
        with:
          path: tests/data/cache
          key: golden-${{ hashFiles('tests/data/manifest.json') }}
          enableCrossOsArchive: true
      - name: Fetch golden test files
        run: python tools/fetch_test_data.py --require-public
      - name: Run tests
        env:
          PSFWIDGET_REQUIRE_TEST_DATA: "1"
        run: >-
          python -m pytest
          --cov --cov-report=term --cov-report=xml
          --req-report=requirement-coverage.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            coverage.xml
            requirement-coverage.csv
          if-no-files-found: ignore

  gui:
    name: GUI (napari, ubuntu, py3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the libraries Qt and OpenGL need on a headless runner
        run: >-
          sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1-mesa-dri
          libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libdbus-1-3
      - run: python -m pip install -e ".[gui-test]"
      - run: python tools/check_licenses.py  # NFR-10 with the GUI stack installed
      - run: npe2 validate psfwidget
      - name: Run GUI tests
        env:
          QT_QPA_PLATFORM: xcb
        run: >-
          xvfb-run -a python -m pytest tests/test_gui_analysis.py tests/test_gui_tracking.py
          tests/test_gui_profile_editor.py tests/test_review_session.py
          --cov --cov-config=tests/gui-coverage.toml --cov-report=term
