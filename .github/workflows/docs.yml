name: Documentation

# Publishes the API reference (UI-05) to GitHub Pages from main. Enable it
# once in the repository settings: Pages → Source → GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[report,docs]"
      - run: python tools/build_api_docs.py site/api
      - name: Add the manuals and a landing page
        run: |
          mkdir -p site/manual
          cp docs/manual/*.md site/manual/
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>PSFWidget documentation</title>
          <h1>PSFWidget documentation</h1>
          <ul>
          <li><a href="api/psfwidget.html">API reference</a></li>
          <li><a href="https://github.com/CU-IBIF/PSFWidget/blob/main/docs/manual/INSTALL.md">Install guide</a></li>
          <li><a href="https://github.com/CU-IBIF/PSFWidget/blob/main/docs/manual/USER_MANUAL.md">User manual</a></li>
          </ul>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
